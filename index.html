<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageRivet 미리보기 불러오는 중</title>
  <meta name="robots" content="noindex">
  <script>
    try {
      const savedTheme = localStorage.getItem("pagerivet.theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch (_error) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <style>
    @view-transition { navigation: none; }
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    html[data-theme="dark"] { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fc; color: #151926; }
    .preview-status { width: min(36rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #dfe3ed; border-radius: 1rem; background: #fff; }
    .preview-status h1 { margin: 0 0 .75rem; font-size: 1.25rem; }
    .preview-status p { margin: 0; color: #667085; line-height: 1.7; }
    html[data-theme="dark"] body { background: #080b12; color: #f1f4fa; }
    html[data-theme="dark"] .preview-status { border-color: #2c374b; background: #121925; }
    html[data-theme="dark"] .preview-status p { color: #aab4c6; }
  </style>
</head>
<body>
  <main class="preview-status" id="preview-status" aria-live="polite">
    <h1>PageRivet 홈페이지를 불러오는 중입니다.</h1>
    <p>현재 Jekyll 원본과 공통 데이터를 미리보기용 HTML로 조립하고 있습니다.</p>
    <noscript>미리보기에는 JavaScript가 필요합니다.</noscript>
  </main>
  <script src="script.js?rev=preview-2026-08-27-1" defer></script>
</body>
</html>
